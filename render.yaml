services:
  - type: web
    name: sahidaam
    runtime: python
    plan: free
    region: singapore

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      gunicorn app:app --bind 0.0.0.0:$PORT --workers 2

    envVars:
      # -------------------------
      # Flask
      # -------------------------
      - key: FLASK_ENV
        value: production

      - key: SECRET_KEY
        generateValue: true

      - key: PYTHONUNBUFFERED
        value: "1"

      # -------------------------
      # Sessions
      # -------------------------
      - key: SESSION_TYPE
        value: filesystem

      # -------------------------
      # Database (PostgreSQL)
      # -------------------------
      - key: DATABASE_URL
        fromDatabase:
          name: sahidaam-db
          property: connectionString

      # -------------------------
      # Email (OTP / verification)
      # -------------------------
      - key: MAIL_SERVER
        value: smtp.gmail.com

      - key: MAIL_PORT
        value: "587"

      - key: MAIL_USE_TLS
        value: "true"

      - key: MAIL_USERNAME
        sync: false   # set in Render UI

      - key: MAIL_PASSWORD
        sync: false   # set in Render UI

databases:
  - name: sahidaam-db
    plan: free
