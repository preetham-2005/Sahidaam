<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – SahiDaam</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to SahiDaam">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- ================= AUTH CONTAINER ================= -->
<div class="auth-container">

    <!-- Dark mode toggle -->
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>

    <div class="auth-card">
        <h1>🌾 SahiDaam</h1>
        <p class="auth-subtitle">Sign in to your account</p>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Login
            </button>
        </form>

        <div id="errorMessage" class="error-message"></div>

        <div class="auth-footer">
            <p>
                Don’t have an account?
                <a href="/register">Register here</a>
            </p>
        </div>
    </div>
</div>

<!-- ================= SCRIPT ================= -->
<script>
    // ================= THEME =================
    function applyTheme() {
        const isDark = localStorage.getItem("theme") === "dark";
        document.body.classList.toggle("dark", isDark);
        document.getElementById("themeBtn").textContent = isDark ? "☀️" : "🌙";
    }

    function toggleTheme() {
        const isDark = document.body.classList.contains("dark");
        localStorage.setItem("theme", isDark ? "light" : "dark");
        applyTheme();
    }

    document.addEventListener("DOMContentLoaded", applyTheme);

    // ================= LOGIN =================
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorBox = document.getElementById("errorMessage");
        const submitBtn = document.querySelector("button[type='submit']");

        errorBox.textContent = "";

        if (!username || !password) {
            errorBox.textContent = "Username and password required";
            return;
        }

        // Disable button to prevent multiple clicks
        submitBtn.disabled = true;
        const originalText = submitBtn.textContent;
        submitBtn.textContent = "Logging in...";

        try {
            console.log("Starting login request...");
            console.log("Username:", username);
            
            const payload = JSON.stringify({ username, password });
            console.log("Payload:", payload);
            
            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: payload
            });

            console.log("Response received");
            console.log("Response status:", res.status);
            console.log("Response ok:", res.ok);
            
            let data;
            try {
                data = await res.json();
                console.log("Parsed JSON data:", data);
            } catch (parseErr) {
                console.error("JSON parse error:", parseErr);
                console.log("Response text:", await res.text());
                errorBox.textContent = "Error parsing response";
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
                return;
            }

            if (!res.ok) {
                console.log("Login failed:", data.error);
                errorBox.textContent = data.error || "Login failed";
                errorBox.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
                return;
            }

            console.log("Login successful!");
            console.log("Redirect URL:", data.redirect);
            
            // Force redirect
            if (data.redirect) {
                console.log("Redirecting to:", data.redirect);
                window.location.href = data.redirect;
            } else {
                console.log("Redirecting to /start");
                window.location.href = "/start";
            }

        } catch (err) {
            console.error("Fetch error:", err);
            console.error("Error message:", err.message);
            errorBox.textContent = "Network error: " + err.message;
            errorBox.style.display = "block";
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
        }
    });
</script>

</body>
</html>
